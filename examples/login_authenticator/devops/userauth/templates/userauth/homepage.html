<!DOCTYPE html>
<html>
<head>
    <title>Welcome to the Homepage</title>
    <style>
        body {
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            padding: 40px 30px 30px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            text-align: center;
        }
        h1 {
            margin-bottom: 24px;
            color: #3498db;
            font-weight: 600;
        }
        .btn {
            display:inline-block;
            margin:10px;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            text-decoration:none;
            font-size:16px;
            cursor:pointer;
        }
        .btn-login { background:#3498db; color:#fff; }
        .btn-login:hover { background:#217dbb; }
        .btn-register { background:#2ecc71; color:#fff; }
        .btn-register:hover { background:#27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Homepage!</h1>
        <a href="{% url 'login' %}" class="btn btn-login">Login</a>
        <a href="{% url 'register' %}" class="btn btn-register">Register</a>
    </div>
</body>
</html>
