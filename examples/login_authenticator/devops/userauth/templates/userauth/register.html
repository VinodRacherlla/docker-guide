<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            padding: 40px 30px 30px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            text-align: center;
        }
        h1 {
            margin-bottom: 24px;
            color: #3498db;
            font-weight: 600;
        }
        form {
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 15px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 15px;
            background: #f9f9f9;
            transition: border 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border: 1.5px solid #3498db;
            outline: none;
        }
        .form-btn {
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 500;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .form-btn:hover {
            background: #27ae60;
        }
        .link {
            color: #3498db;
            text-decoration: none;
            font-size: 15px;
        }
        .link:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 18px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Your Account</h1>
        <form method="post" autocomplete="off">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <div style="color: #e74c3c; font-size: 13px;">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="form-btn">Sign Up</button>
        </form>
        <div class="footer">
            Already have an account?
            <a href="{% url 'login' %}" class="link">Login here</a>
        </div>
    </div>
</body>
</html>
