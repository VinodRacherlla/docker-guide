<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            background: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            padding: 40px 30px 30px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            text-align: center;
        }
        h1 {
            margin-bottom: 24px;
            color: #3498db;
            font-weight: 600;
        }
        .logout-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 500;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .home-link {
            display: block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 15px;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ user.username }}!</h1>
        <form method="post" action="/logout/">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Logout</button>
        </form>
        <a href="/" class="home-link">Return to Homepage</a>
    </div>
</body>
</html>
